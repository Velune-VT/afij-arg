<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AFIJ Archive Cabinet</title><style>
:root{--cream:#efe6d7;--gold:#c9a769}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--cream);font-family:Georgia,"Times New Roman",serif}button{font:inherit}#game{position:relative;width:100%;height:calc(100vh - 76px);overflow:hidden;background:transparent}.scene{position:absolute;inset:0;overflow:hidden}.room-renderer{position:absolute;inset:1.5% 1.5% 1.2%;overflow:hidden;border-radius:38px;isolation:isolate;background:transparent;-webkit-mask-image:radial-gradient(ellipse 86% 88% at 50% 47%,#000 0,#000 58%,#000f 64%,#000d 70%,#0009 77%,#0006 83%,#0003 88%,#0001 94%,transparent 100%);mask-image:radial-gradient(ellipse 86% 88% at 50% 47%,#000 0,#000 58%,#000f 64%,#000d 70%,#0009 77%,#0006 83%,#0003 88%,#0001 94%,transparent 100%)}.room-renderer:before{content:"";position:absolute;inset:0;z-index:899;pointer-events:none;opacity:.12;background:linear-gradient(90deg,transparent 14%,#f5e8cb1d 14.08%,transparent 14.22%,transparent 43%,#f5e8cb12 43.06%,transparent 43.16%,transparent 78%,#f5e8cb17 78.04%,transparent 78.14%);animation:scratches 11s linear infinite}.room-renderer:after{content:"";position:absolute;inset:0;z-index:900;pointer-events:none;background-image:url("archive-pattern.png");background-repeat:repeat;background-size:240px;opacity:.18;mix-blend-mode:soft-light;animation:grain 1.2s steps(2,end) infinite}.world{position:absolute;inset:-27% -30% -28%;transform:translate3d(var(--cam-x,0),var(--cam-y,0),0) scale(1.02);animation:film 8.5s infinite,breathe 19s ease-in-out infinite;background:transparent}.world:after{content:"";position:absolute;inset:0;z-index:850;pointer-events:none;background-image:radial-gradient(circle,#1814162e .7px,transparent .9px);background-size:5px 5px;opacity:.1;mix-blend-mode:multiply}.cab-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,#deb15620,transparent 21%),linear-gradient(#272127,#121015)}.archive-arch{position:absolute;left:19%;right:19%;top:-15%;height:96%;z-index:5;border:28px solid #1a1519;border-bottom:0;border-radius:46% 46% 0 0;opacity:.8}.sidecab{position:absolute;top:8%;bottom:7%;width:25%;background:#1d1a1d;border:10px solid #100d0f;opacity:.68}.sidecab.l{left:-11%;transform:perspective(900px) rotateY(14deg)}.sidecab.r{right:-11%;transform:perspective(900px) rotateY(-14deg)}.archive-box{position:absolute;z-index:19;width:130px;height:84px;background:#4d3b30;border:6px solid #2a201c;box-shadow:0 12px 22px #0008}.archive-box:before{content:"ARCHIVE";position:absolute;left:22px;right:22px;top:27px;background:#b9aa8b;color:#4a4034;text-align:center;font-size:10px;padding:4px}.ab-one{left:4%;bottom:5%;transform:rotate(-7deg)}.ab-two{right:5%;bottom:4%;transform:rotate(5deg);width:110px;height:72px}.loose-folder{position:absolute;z-index:21;width:92px;height:56px;background:#ad9873;clip-path:polygon(0 15%,38% 15%,44% 0,100% 0,100% 100%,0 100%)}.lf-one{left:15%;bottom:10%;transform:rotate(12deg)}.lf-two{right:17%;bottom:11%;transform:rotate(-8deg)}.tiny-clock{position:absolute;right:13%;top:14%;z-index:16;width:62px;height:62px;border-radius:50%;background:#c4b18b;border:7px solid #3d2e27;transform:rotate(3deg)}.tiny-clock:after{content:"";position:absolute;left:50%;top:50%;width:19px;height:3px;background:#4a3a31;transform:rotate(-30deg);transform-origin:left}.hanglamp{position:absolute;left:50%;top:-10px;width:4px;height:150px;background:#393238}.hanglamp:after{content:"";position:absolute;left:-46px;bottom:-8px;border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:58px solid #6c553c;filter:drop-shadow(0 0 28px #e7b85d47)}.flicker{animation:flicker 4.2s ease-in-out infinite}.cabmain{position:absolute;left:50%;top:50%;width:min(690px,58vw);height:min(500px,59vh);background:#2b2729;border:15px solid #141113;box-shadow:0 26px 68px #000b;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:12px;padding:14px;transform:translate(-50%,-50%) rotate(-.35deg);z-index:115}.drawer{position:relative;z-index:121;border:2px solid #201b1d;background:linear-gradient(#584b4d,#322c2f);cursor:pointer;transition:.2s}.drawer:hover,.drawer:focus-visible{filter:brightness(1.14);transform:translateY(-2px);outline:1px solid #b99a69}.drawer:after{content:"";position:absolute;left:9%;right:9%;bottom:8%;height:3px;background:#211c1d}.drawer.opening{animation:open .45s ease}.handle{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);width:35%;height:18%;border:4px solid #9b8768;border-radius:5px}.taglab{position:absolute;left:50%;top:63%;transform:translateX(-50%);width:42%;height:25%;background:#c7bdac;color:#302b29;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.08em}.dust{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#f4e2be40;animation:float 10s linear infinite}.action-dock{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:300;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 18px;background:transparent}.action-dock button{min-width:128px;padding:11px 22px;border:1px solid #debF8b47;border-radius:999px;background:#0a0a0e29;color:#dfd1ba;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:.2s;backdrop-filter:blur(1.5px)}.action-dock button:hover,.action-dock button:focus-visible{color:#f3e3c5;transform:translateY(-2px);background:#3a2d2266;border-color:#e1c2879e;outline:0}.overlay{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:20px;background:#0405086b;backdrop-filter:blur(4px)}.overlay.show{display:flex;animation:fade .25s}.panel{position:relative;width:min(760px,92vw);max-height:84vh;overflow:auto;padding:28px 30px 24px;border:1px solid #be995194;border-radius:18px;background:linear-gradient(145deg,#1a1719f0,#0b0c10f6);box-shadow:0 18px 55px #0008,inset 0 0 0 4px #6c523019;backdrop-filter:blur(12px) saturate(.82)}.panel:before{content:"";position:absolute;inset:7px;border:1px solid #b1894c29;border-radius:12px;pointer-events:none}.kick{color:#c8a86e;letter-spacing:.18em;font-size:10px;text-transform:uppercase}.panel h2{margin:8px 0 13px;font-weight:normal;color:#f4eadb;font-size:25px}.panel p,.room-action-body{color:#e0d7ca;line-height:1.72;font-size:14px}.room-action-lead{margin-bottom:14px;color:#efe2cd;font-size:15px;line-height:1.55;font-style:italic}.panel hr{border:0;border-top:1px solid #554638}.panel em{color:#d0b88d}.file-footer{text-align:center}.close-file{min-width:138px;margin-top:18px;padding:10px 22px;border:1px solid #c59e5b9e;background:linear-gradient(#5b462d57,#1916168a);color:#f0dfc2;letter-spacing:.14em;cursor:pointer}.close-file:hover{background:#5d412b}.action-title{font-size:23px!important}.archive-plaque{position:fixed;top:18px;left:50%;z-index:250;transform:translateX(-50%);pointer-events:none;text-align:center;text-shadow:0 2px 12px #000}.archive-plaque small{display:block;color:#ad9164;letter-spacing:.2em;font-size:8px}.archive-plaque span{font-size:17px}@keyframes float{from{transform:translateY(20px);opacity:0}20%{opacity:.5}80%{opacity:.15}to{transform:translateY(-180px);opacity:0}}@keyframes flicker{48%{filter:brightness(.92)}50%{filter:brightness(1.06)}52%{filter:brightness(.95)}}@keyframes grain{25%{background-position:3px -2px}50%{background-position:-2px 3px}75%{background-position:2px 1px}}@keyframes scratches{to{transform:translateX(2px)}}@keyframes film{17%{filter:brightness(.965) contrast(1.025)}35%{filter:brightness(1.025)}63%{filter:brightness(.95) contrast(1.03)}83%{filter:brightness(1.018)}}@keyframes breathe{50%{filter:sepia(.035) saturate(.96)}}@keyframes open{50%{transform:translateY(16px);box-shadow:0 24px 25px #000}}@keyframes fade{from{opacity:0}}
@media(max-width:760px){#game{height:calc(100vh - 68px)}.room-renderer{inset:1%;border-radius:24px;-webkit-mask-image:radial-gradient(ellipse 92% 92% at 50% 47%,#000 0,#000 62%,#000b 78%,#0004 90%,transparent 100%);mask-image:radial-gradient(ellipse 92% 92% at 50% 47%,#000 0,#000 62%,#000b 78%,#0004 90%,transparent 100%)}.world{inset:-16% -18% -17%}.cabmain{width:78vw;height:60vh;border-width:10px;gap:8px;padding:9px}.sidecab{opacity:.35}.archive-box,.loose-folder{opacity:.55}.taglab{width:58%;font-size:9px}.action-dock{height:68px;gap:7px;padding:10px 8px}.action-dock button{min-width:0;flex:1;max-width:130px;padding:10px 7px;font-size:9px}.panel{padding:22px 20px}.archive-plaque{top:10px}}@media(prefers-reduced-motion:reduce){.world,.room-renderer:before,.room-renderer:after,.dust i,.flicker{animation:none!important}}
</style></head><body><div id="game"><section id="cabinet" class="scene"><div class="room-renderer"><div class="world" id="world"><div class="cab-bg"></div><div class="archive-arch"></div><div class="sidecab l"></div><div class="sidecab r"></div><div class="archive-box ab-one"></div><div class="archive-box ab-two"></div><div class="loose-folder lf-one"></div><div class="loose-folder lf-two"></div><div class="tiny-clock"></div><div class="hanglamp flicker"></div><div class="cabmain" id="drawers"></div><div class="dust" id="dust"></div></div></div></section></div><div class="archive-plaque"></div><nav class="action-dock" aria-label="Archive actions"><button data-action="examine">Examine</button><button data-action="read">Read</button><button data-action="wonder">Wonder</button></nav><div class="overlay" id="actionModal"><article class="panel"><div class="kick">Archive</div><h2 class="action-title" id="actionTitle"></h2><div class="room-action-lead" id="actionLead"></div><div class="room-action-body" id="actionBody"></div><div class="file-footer"><button class="close-file" data-close>Close File</button></div></article></div><div class="overlay" id="fileModal"><article class="panel"><div class="kick" id="fileKick">Filing Cabinet</div><h2 id="fileTitle"></h2><div id="fileBody"></div><div class="file-footer"><button class="close-file" data-close>Close File</button></div></article></div><script>
const drawerData=[['FILE: LEONA FRIEST',`<p><strong>Detective of Veridia</strong></p><p>Logical, observant, and far less cold than she appears, Leona follows evidence where others follow fear. She notices what people hide, what rooms remember, and what her brother is absolutely about to do wrong.</p><p>Though often reserved, Leona cares deeply about the people around her. She values honesty, precision, and patience, preferring facts over assumptions and solutions over dramatics.</p><hr><p><em>“The truth exists whether we're comfortable with it or not.”</em></p>`],['CITY RECORDS: MONOCHROME',`<p><strong>Industrial Capital of Northshire</strong></p><p>Monochrome is the largest city in the known world and the beating heart of industry, commerce, and innovation.</p><p>Built upon towering coastal cliffs, the city grew upward rather than outward, eventually forming six immense layers stacked upon one another. As Monochrome expanded, wealth and influence rose with it.</p><p>Connecting every layer is the Ascension, a colossal elevator network that carries citizens between the city's heights and depths. For many, it is a symbol of opportunity. For others, a reminder that not everyone is destined to reach the top.</p><p>Beneath the brass towers and steam-powered marvels lies a city of secrets, corruption, and mysteries waiting to be uncovered.</p><hr><p><em>“The city is split into six layers. The rich live at the top, the poor live at the bottom, and the criminals live everywhere.” — K. Starling</em></p>`],['FILE: PHOENIX',`<p><strong>Kovion “Kovi” Starling</strong></p><p>Information broker. Wanted criminal. Professional liar. Kovi is known throughout Monochrome for his disguises, false names, impossible luck, and a smile that usually means someone else is already losing.</p><p>Behind the theatrics is a sharp mind and a survivor's instinct. He treats life like a stage play, always performing, always adapting, but the act becomes harder to maintain whenever someone notices the truth beneath the performance.</p><hr><p><em>“Everyone wears a mask. Mine just happens to be prettier.”</em></p><p><em>“I had a much better quote here before somebody got offended.”</em></p>`],['FILE: BENJAMIN FRIEST',`<p><strong>Detective of Veridia</strong></p><p>Warm, reckless, and dangerously kind, Benjamin has a gift for reaching people others overlook. His easygoing nature often hides how seriously he takes every case placed in front of him.</p><p>Ben believes people are worth trusting until proven otherwise. He throws himself into problems without hesitation, guided more by empathy than caution, and refuses to leave anyone behind if he can help it.</p><hr><p><em>“I'd rather get hurt helping someone than walk away wondering if I could've.”</em></p>`],['CASE SUMMARY',`<p><strong>A Flight in June</strong></p><p>In a dying world of cogs and gears where gods fade when forgotten, a pair of twin detectives leave their quiet hometown to investigate a nationwide string of disappearances.</p><p>The deeper they dig into the towering city of Monochrome, the more they uncover a sickness turning people into brass from the inside out, a criminal underworld that seems to know more than it should, and traces of a forgotten god who may still be alive.</p><p>Along the way they cross paths with a wanted criminal who treats life like a stage play, an undercover mafia boss who can manipulate time, ancient spirits from Welsh folklore, and a mystery that reaches far beyond the missing persons case they came to solve.</p><hr><p>Some stories are about finding the truth. This one is about what the world chooses to remember.</p><p>Nothing is permanent. Seasons change, cities crumble, and even gods can fade into myth. Yet despite everything, the world continues to turn.</p>`],['CLASSIFIED FILE: OLIVER MORRIS',`<p><strong>Undercover Operative</strong></p><p>Respected by detectives, feared by criminals, and avoided by informants, Oliver Morris operates deep within Monochrome’s criminal underworld under identities few people are allowed to question.</p><p>Patient, disciplined, and difficult to read, Oliver has spent years learning how to disappear into a role. Beneath his calm exterior is someone fiercely dedicated to his work, willing to endure isolation if it means seeing a case through to the end.</p><hr><p><em>“The difference between a secret and a confession is usually time.”</em></p>`]];
const actions={examine:['Examine','You examine the archive.','Tall cabinets line the walls, their labels worn by age. Some drawers sit neatly closed. Others look as if they have been opened too many times by hands that knew exactly what they were searching for.'],read:['Read','You pull a record from the cabinet.','<strong>A Flight in June</strong> follows twin detectives Leona and Benjamin Friest as they leave Veridia for the industrial city of Monochrome to investigate a string of disappearances.<br><br>The deeper they look, the more the case begins to connect to Brassheart Syndrome, forgotten gods, ancient spirits, and a city determined to bury its own history.'],wonder:['Wonder','You pause for a moment.','Every story begins somewhere. This one chose an archive.']};
const drawers=document.getElementById('drawers');drawerData.forEach((f,i)=>{const b=document.createElement('button');b.className='drawer';b.innerHTML=`<span class="handle"></span><span class="taglab">CASE ${['I','II','III','IV','V','VI'][i]}</span>`;b.onclick=()=>{b.classList.remove('opening');void b.offsetWidth;b.classList.add('opening');setTimeout(()=>openFile(i),230)};drawers.appendChild(b)});function openFile(i){fileTitle.textContent=drawerData[i][0];fileBody.innerHTML=drawerData[i][1];fileKick.textContent=i===5?'Classified File':'Filing Cabinet';fileModal.classList.add('show')}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=actions[b.dataset.action];actionTitle.textContent=a[0];actionLead.textContent=a[1];actionBody.innerHTML=a[2];actionModal.classList.add('show')});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('show'));document.querySelectorAll('.overlay').forEach(x=>x.onclick=e=>{if(e.target===x)x.classList.remove('show')});document.onkeydown=e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'))};
for(let i=0;i<10;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.top=35+Math.random()*60+'%';d.style.animationDelay=-Math.random()*10+'s';d.style.animationDuration=8+Math.random()*8+'s';dust.appendChild(d)}
const camera={tx:0,ty:0,x:0,y:0,px:.5,py:.5};function limits(){const mobile=innerWidth<760;return{x:mobile?Math.min(58,innerWidth*.07):Math.min(235,innerWidth*.17),y:mobile?Math.min(40,innerHeight*.065):Math.min(135,innerHeight*.16)}}function target(cx,cy){const nx=Math.max(0,Math.min(1,cx/innerWidth)),ny=Math.max(0,Math.min(1,cy/Math.max(1,game.clientHeight))),l=limits(),dx=(nx-.5)*2,dy=(ny-.5)*2;camera.px=nx;camera.py=ny;camera.tx=-Math.sign(dx)*Math.pow(Math.abs(dx),1.25)*l.x;camera.ty=-Math.sign(dy)*Math.pow(Math.abs(dy),1.35)*l.y}document.addEventListener('pointermove',e=>target(e.clientX,e.clientY),{passive:true});document.addEventListener('pointerleave',()=>{camera.tx*=.35;camera.ty*=.35});function animate(){camera.x+=(camera.tx-camera.x)*.055;camera.y+=(camera.ty-camera.y)*.055;world.style.setProperty('--cam-x',camera.x.toFixed(2)+'px');world.style.setProperty('--cam-y',camera.y.toFixed(2)+'px');requestAnimationFrame(animate)}requestAnimationFrame(animate);addEventListener('resize',()=>target(innerWidth*camera.px,game.clientHeight*camera.py));
</script><link rel="stylesheet" href="mobile.css"><script src="mobile.js"></script></body></html>
