padding:10px 22px;border:1px solid #c59e5b9e;background:linear-gradient(#5b462d57,#1916168a);color:#f0dfc2;letter-spacing:.14em;cursor:pointer}.close-file:hover{background:#5d412b}.action-title{font-size:23px!important}.archive-plaque{position:fixed;top:18px;left:50%;z-index:250;transform:translateX(-50%);pointer-events:none;text-align:center;text-shadow:0 2px 12px #000}.archive-plaque small{display:block;color:#ad9164;letter-spacing:.2em;font-size:8px}.archive-plaque span{font-size:17px}@keyframes float{from{transform:translateY(20px);opacity:0}20%{opacity:.5}80%{opacity:.15}to{transform:translateY(-180px);opacity:0}}@keyframes flicker{48%{filter:brightness(.92)}50%{filter:brightness(1.06)}52%{filter:brightness(.95)}}@keyframes grain{25%{background-position:3px -2px}50%{background-position:-2px 3px}75%{background-position:2px 1px}}@keyframes scratches{to{transform:translateX(2px)}}@keyframes film{17%{filter:brightness(.965) contrast(1.025)}35%{filter:brightness(1.025)}63%{filter:brightness(.95) contrast(1.03)}83%{filter:brightness(1.018)}}@keyframes breathe{50%{filter:sepia(.035) saturate(.96)}}@keyframes open{50%{transform:translateY(16px);box-shadow:0 24px 25px #000}}@keyframes fade{from{opacity:0}}

<div class="overlay" id="fileModal"><article class="panel"><div class="kick" id="fileKick">Filing Cabinet</div><h2 id="fileTitle"></h2><div id="fileBody"></div><div class="file-footer"><button class="close-file" data-close>Close File</button></div></article></div><script>
const drawerData=[['FILE: LEONA FRIEST',`<p><strong>Detective of Veridia</strong></p><p>Logical, observant, and far less cold than she appears, Leona follows evidence where others follow fear. She notices what people hide, what rooms remember, and what her brother is absolutely about to do wrong.</p><p>Though often reserved, Leona cares deeply about the people around her. She values honesty, precision, and patience, preferring facts over assumptions and solutions over dramatics.</p><hr><p><em>“The truth exists whether we're comfortable with it or not.”</em></p>`],['CITY RECORDS: MONOCHROME',`<p><strong>Industrial Capital of Northshire</strong></p><p>Monochrome is the largest city in the known world and the beating heart of industry, commerce, and innovation.</p><p>Built upon towering coastal cliffs, the city grew upward rather than outward, eventually forming six immense layers stacked upon one another. As Monochrome expanded, wealth and influence rose with it.</p><p>Connecting every layer is the Ascension, a colossal elevator network that carries citizens between the city's heights and depths. For many, it is a symbol of opportunity. For others, a reminder that not everyone is destined to reach the top.</p><p>Beneath the brass towers and steam-powered marvels lies a city of secrets, corruption, and mysteries waiting to be uncovered.</p><hr><p><em>“The city is split into six layers. The rich live at the top, the poor live at the bottom, and the criminals live everywhere.” — Phoenix</em></p>`],['FILE: PHOENIX',`<img class="profile-card" src="Assets/profiles/Phoenix.png" width="1210" height="718" alt="Phoenix. Informant and wanted criminal. A notorious information broker known in Monochrome for his many disguises and false identities. He treats life like a stage play and rarely reveals his true thoughts beneath his charming, chaotic facade. Cocky, flamboyant, clever, theatrical, morally gray, and godly at piano. Everyone wears a mask. Mine just happens to be prettier.">`],['FILE: BENJAMIN FRIEST',`<p><strong>Detective of Veridia</strong></p><p>Warm, reckless, and dangerously kind, Benjamin has a gift for reaching people others overlook. His easygoing nature often hides how seriously he takes every case placed in front of him.</p><p>Ben believes people are worth trusting until proven otherwise. He throws himself into problems without hesitation, guided more by empathy than caution, and refuses to leave anyone behind if he can help it.</p><hr><p><em>“I'd rather get hurt helping someone than walk away wondering if I could've.”</em></p>`],['CASE SUMMARY',`<p><strong>A Flight in June</strong></p><p>In a dying world of cogs and gears where gods fade when forgotten, a pair of twin detectives leave their quiet hometown to investigate a nationwide string of disappearances.</p><p>The deeper they dig into the towering city of Monochrome, the more they uncover a sickness turning people into brass from the inside out, a criminal underworld that seems to know more than it should, and traces of a forgotten god who may still be alive.</p><p>Along the way they cross paths with a wanted criminal who treats life like a stage play, an undercover mafia boss who can manipulate time, ancient spirits from Welsh folklore, and a mystery that reaches far beyond the missing persons case they came to solve.</p><hr><p>Some stories are about finding the truth. This one is about what the world chooses to remember.</p><p>Nothing is permanent. Seasons change, cities crumble, and even gods can fade into myth. Yet despite everything, the world continues to turn.</p>`],['CLASSIFIED FILE: OLIVER MORRIS',`<p><strong>Undercover Operative</strong></p><p>Respected by detectives, feared by criminals, and avoided by informants, Oliver Morris operates deep within Monochrome’s criminal underworld under identities few people are allowed to question.</p><p>Patient, disciplined, and difficult to read, Oliver has spent years learning how to disappear into a role. Beneath his calm exterior is someone fiercely dedicated to his work, willing to endure isolation if it means seeing a case through to the end.</p><hr><p><em>“The difference between a secret and a confession is usually time.”</em></p>`]];
</script><script id="afij-archive-behavior">
(() => {
  const drawers=document.getElementById('drawers');
  const modal=document.getElementById('fileModal');
  const title=document.getElementById('fileTitle');
  const body=document.getElementById('fileBody');
  const kick=document.getElementById('fileKick');
  const groups=[];
  const scene=document.querySelector('.archive-scene');
  const creditsButton=document.getElementById('creditsButton');
  function syncFileBounds(){
    const rect=scene.getBoundingClientRect();
    modal.style.setProperty('--file-stage-x',`${rect.left}px`);
    modal.style.setProperty('--file-stage-y',`${rect.top}px`);
    modal.style.setProperty('--file-stage-width',`${rect.width}px`);
    modal.style.setProperty('--file-stage-height',`${rect.height}px`);
    creditsButton.style.setProperty('--credits-x',`${rect.left+rect.width*.797}px`);
    creditsButton.style.setProperty('--credits-y',`${rect.top+rect.height*.86}px`);
    creditsButton.style.setProperty('--credits-width',`${rect.width*.115}px`);
    creditsButton.style.setProperty('--credits-height',`${rect.height*.095}px`);
  }
  const queueBounds=()=>requestAnimationFrame(syncFileBounds);
  new ResizeObserver(queueBounds).observe(scene);
  addEventListener('resize',queueBounds,{passive:true});
  addEventListener('orientationchange',queueBounds,{passive:true});
  window.visualViewport?.addEventListener('resize',queueBounds,{passive:true});
  window.visualViewport?.addEventListener('scroll',queueBounds,{passive:true});

  function setExpanded(group,expanded){
    group.classList.toggle('expanded',expanded);
    group.querySelector('.drawer-toggle').setAttribute('aria-expanded',String(expanded));
    group.querySelectorAll('.drawer-file').forEach(file => {
      file.disabled=!expanded;
      file.tabIndex=expanded?0:-1;
    });
  }
  function openFile(drawerIndex,hasRecord){
    syncFileBounds();
    body.removeAttribute('tabindex');
    body.removeAttribute('role');
    body.removeAttribute('aria-label');
    modal.classList.remove('credits-view');
    modal.classList.toggle('profile-view',hasRecord&&drawerIndex===2);
    title.textContent=hasRecord?drawerData[drawerIndex][0]:'EMPTY FILE';
    body.innerHTML=hasRecord?drawerData[drawerIndex][1]:'<p>No record has been filed here.</p>';
    kick.textContent=hasRecord&&drawerIndex===5?'Classified File':'Filing Cabinet';
    modal.classList.add('show');
  }
  document.getElementById('creditsButton').addEventListener('click',()=>{
    syncFileBounds();
    modal.classList.remove('profile-view');
    modal.classList.add('credits-view');
    title.textContent='Credits';
    kick.textContent='A Flight in June';
    body.replaceChildren(document.getElementById('creditsContent').content.cloneNode(true));
    body.tabIndex=0;
    body.setAttribute('role','region');
    body.setAttribute('aria-label','Credits content');
    modal.classList.add('show');
  });
  drawerData.forEach((record,index) => {
    // Pick once per drawer so its record stays put throughout this visit.
    const recordSlot=Math.floor(Math.random()*3)+1;
    const group=document.createElement('div');
    group.className='drawer';
    group.setAttribute('role','group');
    group.setAttribute('aria-label',record[0]);
    group.dataset.recordSlot=String(recordSlot);
    group.id=`drawer-files-${index}`;
    const backing=document.createElement('img');
    backing.className='drawer-backing';
    backing.src='Assets/drawer-backing.png';
    backing.alt='';
    backing.draggable=false;
    group.appendChild(backing);
    // Paint order: drawer-backing, file-3, file-2, file-1, Drawer.
    [3,2,1].forEach(slot => {
      const file=document.createElement('button');
      file.type='button';
      file.className=`drawer-file file-${slot}`;
      file.dataset.slot=String(slot);
      file.setAttribute('aria-label',`File ${slot} in ${record[0]}`);
      file.setAttribute('aria-haspopup','dialog');
      const art=document.createElement('img');
      art.src=`Assets/file-${slot}.png`;
      art.alt='';
      art.draggable=false;
      file.appendChild(art);
      file.addEventListener('click',() => openFile(index,slot===recordSlot));
      group.appendChild(file);
    });
    const toggle=document.createElement('button');
    toggle.type='button';
    toggle.className='drawer-toggle';
    toggle.setAttribute('aria-label',record[0]);
    toggle.setAttribute('aria-expanded','false');
    toggle.setAttribute('aria-controls',group.id);
    const face=document.createElement('img');
    face.className='drawer-face';
    face.src='Assets/Drawer.png';
    face.alt='';
    face.draggable=false;
    toggle.appendChild(face);
    toggle.addEventListener('click',() => {
      const expanded=!group.classList.contains('expanded');
      groups.forEach(other => {if(other!==group)setExpanded(other,false);});
      setExpanded(group,expanded);
    });
    group.appendChild(toggle);
    setExpanded(group,false);
    group.addEventListener('keydown',event => {
      if(!group.classList.contains('expanded'))return;
      const files=[...group.querySelectorAll('.drawer-file')].reverse();
      const current=files.indexOf(document.activeElement);
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
        event.preventDefault();
        const direction=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;
        files[current<0?0:(current+direction+3)%3].focus();
      }
    });
    drawers.appendChild(group);
    groups.push(group);
  });
  document.querySelectorAll('[data-close]').forEach(button => {
    button.type='button';
    button.addEventListener('click',()=>modal.classList.remove('show'));
  });
  modal.addEventListener('click',event => {
    if(event.target===modal)modal.classList.remove('show');
  });
  document.addEventListener('keydown',event => {
    if(event.key!=='Escape')return;
    if(modal.classList.contains('show'))modal.classList.remove('show');
    else{
      const expanded=groups.find(group=>group.classList.contains('expanded'));
      if(expanded){setExpanded(expanded,false);expanded.querySelector('.drawer-toggle').focus();}
    }
  });
  const dust=document.getElementById('dust');
  for(let i=0;i<10;i++){
    const mote=document.createElement('i');
    mote.style.left=Math.random()*100+'%';
    mote.style.top=35+Math.random()*60+'%';
    mote.style.animationDelay=-Math.random()*10+'s';
    mote.style.animationDuration=8+Math.random()*8+'s';
    dust.appendChild(mote);
  }
})();

</script><script src="mobile.js?v=19"></script><style id="afij-archive-styles">

</style><script id="afij-accessibility">
(() => {
  let opener;
  const game=document.getElementById('archiveCanvas')||document.getElementById('game');
  const credits=document.getElementById('creditsButton');
  const overlays=[...document.querySelectorAll('.overlay')];
  overlays.forEach(overlay => {
    let wasOpen=false;
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label',overlay.id==='fileModal'?'Archive case file':'Archive action');
    overlay.setAttribute('aria-hidden','true');
    new MutationObserver(() => {
      const opened=overlay.classList.contains('show');
      if(opened===wasOpen)return;
      wasOpen=opened;
      overlay.setAttribute('aria-hidden',String(!opened));
      if(opened){opener=document.activeElement;game.inert=true;credits.inert=true;overlay.querySelector('[data-close]').focus({preventScroll:true});overlay.querySelector('.panel').scrollTop=0;overlay.querySelector('#fileBody').scrollTop=0;}
      else{game.inert=false;credits.inert=false;if(opener?.isConnected)opener.focus();}
    }).observe(overlay,{attributes:true,attributeFilter:['class']});
  });
  document.addEventListener('keydown',event => {
    const open=overlays.find(overlay=>overlay.classList.contains('show'));
    if(open&&event.key==='Tab'){
      const controls=[...open.querySelectorAll('a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(control=>control.getClientRects().length);
      const first=controls[0],last=controls[controls.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
      else if(!open.contains(document.activeElement)){event.preventDefault();first.focus();}
    }
  });
})();

</script><script id="afij-camera-behavior">
(() => {

  return{x:-clamp((x/width-.5)*2,-1,1)*maxX,y:-clamp((y/height-.5)*2,-1,1)*maxY};

function scenePoint(x,y,width,height,pose){
  return{x:width/2+(x-width/2-pose.x)/pose.z,y:height/2+(y-height/2-pose.y)/pose.z};
}

function poseAtPoint(point,width,height,z){
  return{x:(width/2-point.x)*z,y:(height/2-point.y)*z,z};
}

let touching=false;
let focusedDrawer=null,returnPose=null,transitioning=false;
const stopFrame=()=>{cancelAnimationFrame(motion.frame);motion.frame=0;motion.last=0;};
function isPaused(){
  const focused=document.activeElement;
  const keyboardFocus=!mobile.matches&&scene.contains(focused)&&focused.matches('button:focus-visible,a:focus-visible');
  return document.hidden||touching||modal.classList.contains('show')||Boolean(drawers.querySelector('.drawer.expanded'))||keyboardFocus;
}
function paint(){

  camera.style.setProperty('--camera-x',`${motion.x.toFixed(2)}px`);
  camera.style.setProperty('--camera-y',`${motion.y.toFixed(2)}px`);
  camera.style.setProperty('--camera-zoom',motion.z.toFixed(5));

  motion.x=motion.tx;motion.y=motion.ty;motion.z=motion.tz;motion.last=0;
  transitioning=false;camera.classList.remove('camera-transition');

function animate(time){
  motion.frame=0;
  if(mobile.matches)return;
  if(document.hidden||touching||modal.classList.contains('show')){motion.last=0;return;}
  if(isPaused()&&!transitioning){motion.tx=motion.x;motion.ty=motion.y;motion.last=0;return;}
  const dt=motion.last?Math.min(40,time-motion.last):16;
  motion.last=time;
  const amount=1-Math.exp(-dt/(transitioning?85:100));
  motion.x+=(motion.tx-motion.x)*amount;
  motion.y+=(motion.ty-motion.y)*amount;
  motion.z+=(motion.tz-motion.z)*amount;
  if(Math.abs(motion.x-motion.tx)<.12&&Math.abs(motion.y-motion.ty)<.12&&Math.abs(motion.z-motion.tz)<.0005){settled();return;}
  paint();motion.frame=requestAnimationFrame(animate);
}
function target(point,transition=false){
  motion.tx=point.x;motion.ty=point.y;motion.tz=point.z??motion.z;
  if(transition){transitioning=true;camera.classList.add('camera-transition');}
  if(reduced.matches&&transition){stopFrame();settled();return;}
  if(!motion.frame)motion.frame=requestAnimationFrame(animate);

function focusPose(drawer){
  const bounds=scene.getBoundingClientRect();
  const rect=drawer.getBoundingClientRect();
  const point=scenePoint(rect.left-bounds.left+rect.width*.5,rect.top-bounds.top+rect.height*.55,bounds.width,bounds.height,motion);
  return poseAtPoint(point,bounds.width,bounds.height,2.65);
}
function syncDrawerFocus(){
  const expanded=mobile.matches?null:drawers.querySelector('.drawer.expanded');
  if(expanded===focusedDrawer)return;
  if(expanded){
    if(!focusedDrawer&&!returnPose)returnPose={x:motion.x,y:motion.y,z:motion.z};
    focusedDrawer=expanded;camera.dataset.view='zooming-in';target(focusPose(expanded),true);
  }else{
    focusedDrawer=null;
    if(returnPose){const saved=returnPose;returnPose=null;camera.dataset.view='returning';target(saved,true);}

  const paused=isPaused();
  camera.dataset.paused=String(paused);
  if(paused&&!transitioning){stopFrame();motion.tx=motion.x;motion.ty=motion.y;}

scene.addEventListener('pointermove',event=>{

  touching=false;stopFrame();focusedDrawer=null;returnPose=null;transitioning=false;
  if(mobile.matches)return;
